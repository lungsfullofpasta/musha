syntax = "proto3";

package musha.v1;

option go_package = "github.com/lungsfullofpasta/musha/gen/go/musha/v1;mushav1";

// AppService is the API the web app talks to. Add RPCs here, then run `npm run generate`.
service AppService {
  // GetStatus reports that the API is up and which build is running.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message GetStatusRequest {}

message GetStatusResponse {
  string status = 1;
  string version = 2;
}
